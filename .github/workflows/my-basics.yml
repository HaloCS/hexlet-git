name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]  # Триггер на push в ветку main
  pull_request:           # И на открытие/обновление PR
    branches: [ "main" ]

jobs:
  test:                   # Джоба для тестирования
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print testing message
        run: echo "Testing..."

      # Пример реального теста (замените на свои команды)
      - name: Run tests
        run: |
          echo "Installing dependencies..."
          npm install  # или pip install, make и т.д.
          echo "Running tests..."
          npm test     # или pytest, ./run_tests.sh

  deploy:                 # Джоба для деплоя
    needs: test           # Зависит от успешного завершения test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print deploying message
        run: echo "Deploying..."

      # Пример реального деплоя (замените на свои команды)
      - name: Deploy to production
        run: |
          echo "Building artifacts..."
          npm run build  # или ./build.sh
          echo "Deploying to server..."
          scp -r dist/ user@server:/path  # или rsync, kubectl и т.д.
